<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本即時影像地圖 · Japan Live Cams</title>
<meta name="description" content="以地圖探索日本各地的公開即時影像直播：觀光名所、海岸美景、山岳、交通設施。">
<!-- ET-EDIT: 反快取。⚠️ 誠實說：這幾行對「文件本身」的效果有限，
     現代瀏覽器多半以 HTTP 標頭為準。真正可靠的是兩件事：
       ① 本機 server（scripts/serve.py）送 Cache-Control: no-cache, must-revalidate
       ② 「重新整理」鈕走帶 cache-buster 的網址（見 reloadFresh()）—— 這招一定有效
     留著這幾行是因為公開站（GitHub Pages）沒法設標頭，聊勝於無。 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<script>
/* ET-EDIT ── 錯誤捕捉（debug 面板用）【放在 head 最前面，早於任何外部資源】
   ⚠️ 為什麼一定要在這裡：原本放在主 <script>（body 末端）裡，
      那就**晚於**上面那三支 unpkg CSS 與底下兩支 unpkg JS ——
      那些資源若載入失敗或拋錯，事件早就發生完了，根本收不到。
   ⚠️ JLC_DBG 只能在【一個】script 裡宣告：經典 script 的頂層 const/let
      共用同一個全域語彙環境，宣告兩次會直接 "has already been declared"。
      主 script 直接沿用這裡建立的 JLC_DBG 即可。 */
const JLC_DBG = { errors: [], warns: [], t0: Date.now() };
window.addEventListener('error', e => {
  const ts = new Date().toISOString().slice(11, 19);
  const t = e.target;
  // 資源（script/link/img）載入失敗時 e.message 是空的、e.target 才是線索。
  if(t && t !== window && t.tagName && (t.tagName === 'SCRIPT' || t.tagName === 'LINK' || t.tagName === 'IMG')){
    JLC_DBG.errors.push(`[${ts}] 資源載入失敗 <${t.tagName.toLowerCase()}> ${t.src || t.href || '(未知)'}`);
    return;
  }
  // 跨網域腳本拋的錯，瀏覽器只會給 "Script error." 且位置是 :0:0（資訊被刻意遮蔽）。
  const where = e.filename ? `${String(e.filename).split('/').pop()}:${e.lineno}:${e.colno}` : '(無檔名 → 跨網域腳本，資訊被瀏覽器遮蔽)';
  // 有 Error 物件就撈堆疊（被遮蔽時 e.error 會是 null，就沒得撈）。
  const st = e.error && e.error.stack ? ' ┄ ' + String(e.error.stack).split('\n').slice(1, 3).join(' ┄ ').trim().slice(0, 180) : '';
  JLC_DBG.errors.push(`[${ts}] ${e.message} @ ${where}${st}`);
}, true);   // ⚠️ capture:true 必要 —— 資源載入錯誤不會冒泡
window.addEventListener('unhandledrejection', e => {
  JLC_DBG.errors.push(`[${new Date().toISOString().slice(11, 19)}] (promise) ${(e.reason && (e.reason.message || e.reason)) || '未知'}`);
});
/* 圖書館／瀏覽器注入的程式常常只 console.error 不拋錯 —— 一起收起來，
   否則錯誤清單一片空白、卻在 console 裡罵得很兇。 */
for(const lv of ['error', 'warn']){
  const orig = console[lv].bind(console);
  console[lv] = (...a) => {
    try{ JLC_DBG[lv === 'error' ? 'errors' : 'warns'].push(`[${new Date().toISOString().slice(11, 19)}] (console.${lv}) ${a.map(x => (x && x.message) || String(x)).join(' ').slice(0, 300)}`); }catch(_){}
    orig(...a);
  };
}
</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  :root{
    --ink:#0e1726; --ink-2:#243247; --muted:#64748b; --muted-2:#8595a8;
    --bg:#eef2f7; --card:rgba(255,255,255,.86); --line:rgba(15,30,50,.10);
    --accent:#d6455a; --accent-ink:#fff;
    --live:#12b76a; --offline:#f04438; --unknown:#94a3b8; --blocked:#f79009;
    --shadow:0 10px 30px rgba(10,25,45,.14), 0 2px 6px rgba(10,25,45,.08);
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  /* ET-EDIT: 手機用 dvh（動態可視高度）—— 見下方 .tools/.panel 的說明。
     沒有 dvh 的瀏覽器沿用 height:100%（＝大視窗高度），至少有 fallback。 */
  @supports (height:100dvh){ html,body{height:100dvh} }
  body{
    margin:0; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Hiragino Sans","Yu Gothic UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit}
  a{color:var(--accent)}

  /* ── 地圖：視覺主體，滿版 ───────────────────────────── */
  /* ET-EDIT: 手機實機修正 —— 全部改成 position:fixed
     為什麼：absolute 是對「初始包含區塊」定位，手機上那等於**大的視窗高度**
     （想像網址列收起時的狀態），但使用者看到的是**小的可視區**。
     結果貼底的東西（抽屜、右下按鈕）會被網址列蓋住 → 看得到、點不到。
     桌面模擬沒有網址列，所以是「模擬正常、實機不行」。
     fixed 才是對可視區定位。 */
  #map{position:fixed;inset:0;background:#dfe6ee;z-index:0}
  .leaflet-container{font:inherit;background:#dfe6ee}
  .leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.78)}
  /* 底圖切換器（地圖左下角）：小、半透明、不搶視線 */
  .basemap-pick select{font:inherit;font-size:11px;padding:4px 6px;border-radius:7px;
    border:1px solid rgba(15,40,70,.18);background:rgba(255,255,255,.9);
    color:#16324f;box-shadow:0 2px 8px rgba(10,25,45,.15);cursor:pointer;max-width:190px}
  .leaflet-bar a{border-radius:8px}

  /* ── 玻璃面板 ──────────────────────────────────────── */
  .panel{
    position:fixed; z-index:900; display:flex; flex-direction:column;
    left:18px; top:18px; bottom:calc(18px + var(--bh, 0px)); width:372px; max-width:calc(100vw - 36px);
    background:var(--card); backdrop-filter:blur(18px) saturate(150%);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
    border:1px solid rgba(255,255,255,.65); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden;
  }
  .head{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .mark{
    width:30px;height:30px;flex:0 0 30px;border-radius:9px;
    background:linear-gradient(145deg,#d6455a,#8f2038);color:#fff;
    display:grid;place-items:center;font-size:15px;box-shadow:0 4px 10px rgba(214,69,90,.35)
  }
  .brand h1{margin:0;font-size:16px;letter-spacing:.2px}
  .brand .sub{font-size:11px;color:var(--muted);margin-top:2px}
  /* ET-EDIT: 資料新鮮度（管線停擺時網頁原本看不出資料新舊） */
  .brand .fresh{font-size:11px;margin-top:3px;color:var(--muted-2);display:flex;align-items:center;gap:5px}
  .brand .fresh .dot{width:6px;height:6px;border-radius:50%;background:var(--live);flex:none}
  .brand .fresh.warn{color:#b54708}   .brand .fresh.warn .dot{background:var(--blocked)}
  .brand .fresh.error{color:#912018}  .brand .fresh.error .dot{background:var(--offline)}
  /* ET-EDIT: 管線健康示警橫幅（讀 data/pipeline_health.json；不存在則不顯示） */
  .warnbar{margin:0 0 10px;padding:9px 12px;border-radius:12px;font-size:12px;line-height:1.55;
    background:rgba(247,144,9,.10);border:1px solid rgba(247,144,9,.35);color:#7a3d00;
    display:flex;gap:8px;align-items:flex-start}
  .warnbar.error{background:rgba(240,68,56,.10);border-color:rgba(240,68,56,.35);color:#912018}
  /* ⚠️ 一定要自己補：.warnbar 用了 display:flex，會蓋掉瀏覽器預設的
     [hidden]{display:none} —— 少了這行，即使 HTML 標了 hidden，
     空的示警條還是會一直佔位（本專案第五次踩這個坑）。 */
  .warnbar[hidden]{display:none}
  .warnbar .ic{flex:none;font-size:13px;line-height:1.4}
  .warnbar .tx{flex:1;min-width:0}
  .warnbar b{font-weight:700}
  .warnbar code{background:rgba(0,0,0,.06);padding:0 4px;border-radius:4px;font-size:11px}
  .stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  /* 系統通知：按鈕 + 徽章 + 彈窗（點擊才展開，不佔面板空間） */
  .tools button{position:relative}
  .tools button.has-warn{color:#fbbf24}
  .tools .badge{position:absolute;top:-1px;right:-1px;min-width:15px;height:15px;padding:0 4px;
                border-radius:999px;background:#f59e0b;color:#1a1205;font-size:10px;font-weight:700;
                line-height:15px;text-align:center;box-shadow:0 0 0 2px var(--bg,#0b0f14)}
  .tools .badge[hidden]{display:none}
  #amodal{position:fixed;inset:0;z-index:1200;display:none;background:rgba(4,8,14,.62);
          backdrop-filter:blur(3px);padding:5vh 16px;overflow:auto}
  #amodal.show{display:grid;place-items:start center}
  /* ── 系統通知面板 ─────────────────────────────────────────────
     ⚠️ 這個面板**永遠是深色底**（不隨頁面主題切換），所以文字不能沿用頁面變數：
        淺色主題下 var(--ink) 是深藍 #0e1726、var(--muted) 是 #64748b，
        直接用在深色底上會變成「深字配深底」＝幾乎看不見（使用者實測回報）。
     解法：在這裡就地定義一組亮色變數，面板內所有文字都用它們。 */
  .abox{--a-ink:#eef4fb; --a-ink2:#c3cfe0; --a-muted:#9fb0c4;
        /* 字級基準：使用者要求放大字體。改這一個值就能整體縮放。 */
        --a-fs:15px;
        width:min(680px,100%);background:var(--panel,#0f1620);border:1px solid rgba(245,158,11,.32);
        border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.5);
        color:var(--a-ink)}
  .ahd{display:flex;align-items:center;gap:10px;padding:14px 16px;
       border-bottom:1px solid rgba(245,158,11,.22);background:rgba(245,158,11,.07)}
  .ahd h2{margin:0;font-size:calc(var(--a-fs) + 2px);color:#fbbf24;flex:1}
  .abody{padding:14px 18px;max-height:66vh;overflow:auto;
         font-size:var(--a-fs);line-height:1.75;
         color:var(--a-ink)}
  .abody .a-group{margin-bottom:14px}
  .abody .a-group:last-child{margin-bottom:0}
  .abody .a-gt{font-size:calc(var(--a-fs) - 3px);font-weight:700;letter-spacing:.4px;text-transform:uppercase;
               color:var(--a-muted);margin-bottom:6px}
  .abody .a-item{padding:12px 14px;border-radius:9px;background:rgba(245,158,11,.07);
                 border:1px solid rgba(245,158,11,.2);margin-bottom:7px}
  .abody .a-item.ok{background:rgba(148,163,184,.07);border-color:rgba(148,163,184,.22)}
  .abody .a-kind{display:inline-block;font-size:calc(var(--a-fs) - 4px);padding:2px 7px;border-radius:4px;
                 margin-right:6px;background:rgba(245,158,11,.24);color:#fde68a;vertical-align:1px}
  .abody .a-item.ok .a-kind{background:rgba(148,163,184,.22);color:#cbd5e1}
  .abody .a-host{font-family:ui-monospace,Menlo,monospace;color:#fde68a;word-break:break-all}
  .abody .a-item.ok .a-host{color:#cbd5e1}
  .abody .a-note{margin-top:4px;opacity:.88}
  /* 「誰處理／處理完沒／接下來會怎樣」——使用者最需要看到的欄位。
     ⚠️ 對比度：深色模式下來源說明常「看不到」——文字不要用低 opacity，
        改用明確的亮色 + 半透明底，確保在任何底色上都讀得清楚。 */
  .abody .a-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .abody .a-st{font-size:calc(var(--a-fs) - 3px);font-weight:700;padding:3px 10px;border-radius:999px;
               margin-left:auto;white-space:nowrap}
  .abody .a-next{margin-top:9px;padding:10px 12px;border-radius:8px;font-size:var(--a-fs);
                 line-height:1.6;color:var(--a-ink);
                 background:rgba(125,211,252,.13);border-left:3px solid #7dd3fc}
  .abody .a-next-call{background:rgba(245,158,11,.16);border-left-color:#fbbf24}
  .abody .a-meta{margin-top:7px;font-size:calc(var(--a-fs) - 3px);color:var(--a-ink2);opacity:.9}
  .abody .a-ev{margin-top:8px;font-size:calc(var(--a-fs) - 1px)}
  .abody .a-ev summary{cursor:pointer;color:var(--a-ink2);list-style:none}
  .abody .a-ev summary::-webkit-details-marker{display:none}
  .abody .a-ev summary::before{content:'▸ '}
  .abody .a-ev[open] summary::before{content:'▾ '}
  .abody .a-ev pre{margin:7px 0 0;padding:10px 12px;border-radius:7px;
                   font-size:calc(var(--a-fs) - 2px);
                   line-height:1.6;white-space:pre-wrap;word-break:break-word;
                   color:var(--a-ink);
                   background:rgba(255,255,255,.06);
                   font-family:ui-monospace,Menlo,monospace}
  /* 可驗證的探測證據：讓使用者能自行複驗，不必相信管線的結論 */
  .abody .a-probe{margin-top:8px;padding:10px 12px;border-radius:7px;
                  font-size:calc(var(--a-fs) - 1px);
                  line-height:1.6;color:var(--a-ink);
                  background:rgba(255,255,255,.05);
                  border:1px solid rgba(255,255,255,.09)}
  .abody .a-probe .k{color:var(--a-ink2)}
  .abody .a-probe a{color:#7dd3fc;word-break:break-all;text-decoration:underline}
  .abody .a-probe ul{margin:5px 0 0;padding-left:16px}
  .abody .a-probe li{margin-bottom:3px}
  .abody .a-hint{margin-top:6px;font-size:calc(var(--a-fs) - 3px);opacity:.55;
                 font-family:ui-monospace,Menlo,monospace}
  .afoot{padding:13px 18px;border-top:1px solid rgba(245,158,11,.18);font-size:calc(var(--a-fs) - 2px);
         color:var(--a-muted);background:rgba(255,255,255,.02)}
  .chip{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;line-height:1;
    padding:5px 9px;border-radius:999px;background:rgba(15,30,50,.055);color:var(--ink-2);
    border:1px solid transparent;white-space:nowrap
  }
  .chip b{font-weight:700}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--unknown)}
  .chip.live{color:#04693b;background:rgba(18,183,106,.13)}
  .chip.live .dot{background:var(--live)}
  .chip.offline{color:#912018;background:rgba(240,68,56,.12)}
  .chip.offline .dot{background:var(--offline)}
  .chip.unknown .dot{background:var(--unknown)}
  .chip.blocked{color:#93370d;background:rgba(247,144,9,.14)}
  .chip.blocked .dot{background:var(--blocked)}

  .controls{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .search{position:relative}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45}
  .search input{
    width:100%;padding:10px 34px 10px 34px;border-radius:11px;border:1px solid var(--line);
    background:rgba(255,255,255,.9);font-size:13px;outline:none;color:var(--ink)
  }
  .search input:focus{border-color:rgba(214,69,90,.55);box-shadow:0 0 0 3px rgba(214,69,90,.12)}
  .search .clear{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;
    color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:4px 7px;border-radius:6px;display:none
  }
  .search.has-value .clear{display:block}
  .search .clear:hover{background:rgba(15,30,50,.06)}

  .seg{display:flex;background:rgba(15,30,50,.06);border-radius:11px;padding:3px;gap:2px}
  .seg button{
    flex:1;border:0;background:transparent;border-radius:8px;padding:7px 6px;cursor:pointer;
    font-size:12px;font-weight:600;color:var(--muted);transition:background .15s,color .15s;white-space:nowrap
  }
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(10,25,45,.10)}
  .seg button .n{font-weight:500;opacity:.7;font-size:11px}

  .cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;
        -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%);
        mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%)}
  .cats::-webkit-scrollbar{height:5px}
  .cats::-webkit-scrollbar-thumb{background:rgba(15,30,50,.16);border-radius:4px}
  .cats button{
    border:1px solid var(--line);background:rgba(255,255,255,.75);border-radius:999px;
    padding:5px 10px;font-size:11.5px;cursor:pointer;color:var(--ink-2);white-space:nowrap
  }
  .cats button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cats button .n{opacity:.62;font-size:10.5px;margin-left:4px}

  .listwrap{flex:1;overflow:auto;overscroll-behavior:contain}
  .listwrap::-webkit-scrollbar{width:8px}
  .listwrap::-webkit-scrollbar-thumb{background:rgba(15,30,50,.16);border-radius:8px}
  .listwrap .empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7}
  .item{
    padding:11px 18px;border-bottom:1px solid rgba(15,30,50,.055);cursor:pointer;
    display:flex;gap:10px;align-items:flex-start;transition:background .12s
  }
  .item:hover,.item.active{background:rgba(214,69,90,.06)}
  /* // ET-EDIT: 鍵盤選取清單時，焦點須清楚可見。 */
  .item:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
  .item .live-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:5px;background:var(--unknown);box-shadow:0 0 0 3px rgba(148,163,184,.18)}
  .item .live-dot.live{background:var(--live);box-shadow:0 0 0 3px rgba(18,183,106,.18)}
  .item .live-dot.offline{background:var(--offline);box-shadow:0 0 0 3px rgba(240,68,56,.16)}
  .item .live-dot.blocked{background:var(--blocked);box-shadow:0 0 0 3px rgba(247,144,9,.16)}
  .item .body{min-width:0;flex:1}
  .item .t{font-size:13px;font-weight:600;line-height:1.4;word-break:break-word}
  .item .m{font-size:11px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px}
  .item .m .tag{background:rgba(15,30,50,.055);border-radius:5px;padding:1px 5px}
  .badge{display:inline-block;font-size:10px;font-weight:600;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
  .badge.blocked{background:rgba(247,144,9,.16);color:#93370d}
  .badge.live{background:rgba(18,183,106,.16);color:#04693b}
  .badge.offline{background:rgba(240,68,56,.14);color:#912018}

  .foot{padding:9px 18px;border-top:1px solid var(--line);display:flex;align-items:center;
        justify-content:space-between;gap:8px;font-size:10.5px;color:var(--muted)}
  .foot .legend{display:flex;gap:9px;align-items:center}
  .foot .legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:0}

  /* ── 地圖工具列 ───────────────────────────────────── */
  .tools{position:fixed;right:18px;top:18px;z-index:900;display:flex;flex-direction:column;gap:8px}
  .tools button{
    width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.7);
    background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;color:var(--ink-2)
  }
  .tools button:hover{background:#fff}
  /* ET-EDIT: 底圖缺金鑰時，鑰匙鈕示警（琥珀色）—— 否則使用者只看到浮水印卻不知原因 */
  .tools button.has-warn{background:#fff3e0;color:#a35c00}
  .tools button.has-warn:hover{background:#ffe8cc}
  .tools svg{width:19px;height:19px}
  /* ⚠️ ET-EDIT: 修 [hidden] 失效 —— 上面 `.tools button{display:grid}` 會蓋掉
     瀏覽器預設的 `[hidden]{display:none}`，導致隱藏鈕仍可見但沒綁事件（按了沒反應）。
     發佈版沒有 alerts.json → 鈴鐺就是這樣變成「看得見卻點不動」。 */
  .tools button[hidden]{display:none}
  /* ET-EDIT: Toast —— 通用浮動通知（右下堆疊、由右滑入、不擋操作）
     第一個使用者：版本更新提示。其他通知可直接沿用 .toast 這個結構。 */
  .toasts{position:fixed;right:18px;bottom:18px;z-index:3200;display:flex;
    flex-direction:column;gap:9px;align-items:flex-end;
    max-width:min(358px,calc(100vw - 28px));pointer-events:none}
  .toast{pointer-events:auto;display:flex;gap:11px;align-items:flex-start;width:100%;

    transition:transform .3s cubic-bezier(.2,.85,.25,1),opacity .3s ease}
  .toast.show{transform:translateX(0);opacity:1}
  .toast .ic2{flex:none;font-size:15px;line-height:1.25}
  .toast .tl{flex:1;min-width:0}
  .toast .tt{font-weight:700;font-size:13px}
  .toast .tb{color:var(--muted);margin-top:1px}
  .toast .ta{display:flex;gap:7px;margin-top:9px}
  .toast .ta button{border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:600;
    padding:6px 13px;border-radius:9px;background:var(--accent);color:#fff}
  .toast .ta button.ghost{background:rgba(15,30,50,.07);color:var(--ink-2);font-weight:500}
  .toast .x{flex:none;border:0;background:none;cursor:pointer;color:var(--muted-2);
    font-size:15px;line-height:1;padding:1px 3px;border-radius:6px}
  .toast .x:hover{color:var(--ink);background:rgba(15,30,50,.06)}
  @media (max-width:640px){ .toasts{right:14px;bottom:14px;left:14px;max-width:none} }

  /* ET-EDIT: 手機版搜尋鈕 —— 抽屜收合時出現在左上角
     為什麼：手機版把整個面板做成底部抽屜，收合後只剩一條 56px 的把手，
     沒有任何「這裡可以搜尋」的提示 → 使用者找不到搜尋。 */
  .searchfab{display:none}
  @media (max-width:820px){
    .searchfab{
      position:fixed;left:14px;top:14px;z-index:520;
      display:flex;align-items:center;gap:6px;
      padding:9px 14px 9px 11px;border:0;border-radius:999px;cursor:pointer;
      background:rgba(255,255,255,.97);color:var(--ink);
      font:inherit;font-size:13px;font-weight:600;
      box-shadow:0 6px 20px rgba(10,25,45,.22);
    }
    /* ⚠️ [hidden] 必須自己補 —— 上面 .searchfab 用了 display:flex，
       會蓋掉瀏覽器預設的 [hidden]{display:none}。這個坑本專案踩過兩次
       （.tools button、.tools .badge），別再犯第三次。 */
    .searchfab[hidden]{display:none}
    .searchfab svg{width:16px;height:16px}
    .searchfab:active{transform:scale(.97)}
  }

  /* ET-EDIT: 手機版面板的「收合」鈕 —— 光靠頂端那條小把手太不明顯，
     使用者回報「找不到關閉的方式」。 */
  .psheetclose{
    display:none;position:absolute;right:10px;top:10px;z-index:5;
    width:32px;height:32px;border:0;border-radius:50%;cursor:pointer;
    background:rgba(15,30,50,.07);color:var(--ink-2);
    font-size:16px;line-height:1;place-items:center
    /* ⚠️ 這裡不要寫 display —— 上面 .psheetclose{display:none} 會被蓋掉，
       桌機也會冒出收合鈕。display 只在手機的 media query 裡設。 */
  }
  .psheetclose:hover{background:rgba(15,30,50,.13)}

  /* ET-EDIT: 隱藏 debug 面板（實機問題排查用）
     開啟方式：① 網址加 ?debug=1   ② 在「資料更新於…」那行連點 5 下 */
  #dbg{position:fixed;inset:0;z-index:3000;background:rgba(6,12,20,.92);
    display:flex;align-items:center;justify-content:center;padding:12px}
  #dbg[hidden]{display:none}
  .dbgbox{background:#0e1620;color:#cfe3f5;border-radius:12px;width:100%;max-width:620px;
    max-height:calc(var(--vh, 100vh) - 40px);display:flex;flex-direction:column;overflow:hidden;
    border:1px solid rgba(120,170,220,.25);font-family:ui-monospace,Menlo,monospace}
  .dbghd{display:flex;align-items:center;gap:8px;padding:10px 12px;
    border-bottom:1px solid rgba(120,170,220,.2);font-size:13px}
  .dbghd b{flex:1;font-family:-apple-system,"Noto Sans TC",sans-serif}
  .dbghd button{border:0;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:12px;
    background:rgba(120,170,220,.2);color:#dbeeff;font-family:inherit}
  .dbghd button.ok{background:#1f7a45;color:#fff}
  #dbgText{margin:0;padding:12px;overflow:auto;font-size:11px;line-height:1.6;
    white-space:pre-wrap;word-break:break-all;-webkit-overflow-scrolling:touch;flex:1}

  .mobile-handle{display:none}

  /* ── 彈出視窗（Popup）──────────────────────────────── */
  .leaflet-popup-content-wrapper{border-radius:12px;box-shadow:var(--shadow)}
  .leaflet-popup-content{margin:12px 14px;min-width:210px}
  .pop .t{font-size:13px;font-weight:700;line-height:1.4;margin-bottom:5px}
  .pop .meta{font-size:11px;color:var(--muted);line-height:1.6}
  .pop .meta .tag{background:rgba(15,30,50,.06);border-radius:5px;padding:1px 5px;margin-right:4px}
  .pop .meta .tag.live{background:rgba(18,183,106,.14);color:#0b7a45;font-weight:600}
  .pop .approx{color:#b54708;font-style:italic}
  .pop .warn{font-size:11px;color:#93370d;background:rgba(247,144,9,.13);border-radius:7px;padding:5px 8px;margin-top:7px;line-height:1.5}
  .pop .act{display:flex;gap:8px;margin-top:9px}
  .pop .act button{
    flex:1;border:0;border-radius:9px;padding:8px 10px;cursor:pointer;font-size:12px;font-weight:600;
    background:var(--ink);color:#fff
  }
  .pop .act button.ghost{background:rgba(15,30,50,.07);color:var(--ink-2)}

  /* ── 播放 Modal ───────────────────────────────────── */
  #modal{
    position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;
    background:rgba(8,15,25,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:18px;
    /* ET-EDIT: 手機上要讓開瀏覽器底部工具列（Arc Search 等會蓋住網頁底部）。
       置中是在「大視窗」裡置中 → 不補的話整個框會偏下、底部被切。 */
    padding-bottom:calc(18px + var(--bh, 0px) + env(safe-area-inset-bottom, 0px))
  }
  #modal.show{display:flex}
  .box{
    background:#fff;border-radius:16px;overflow:hidden;width:min(1040px,96vw);max-height:94vh;
    /* ET-EDIT: 用實測可視高度，不用 vh（定義歧義 + 手機上偏高導致框超出畫面） */
    max-height:calc(var(--vh, 100vh) - 36px - var(--bh, 0px));
    display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.45)
  }
  .box .hd{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .box .hd .tt{flex:1;min-width:0}
  .box .hd .tt h2{margin:0;font-size:15px;line-height:1.4;word-break:break-word}
  .box .hd .tt .sub{font-size:11px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px}
  .box .hd .close{
    border:0;background:rgba(15,30,50,.07);border-radius:9px;width:32px;height:32px;flex:0 0 32px;
    cursor:pointer;font-size:15px;color:var(--ink-2);line-height:1
  }
  .box .hd .close:hover{background:rgba(15,30,50,.12)}
  /* 「前往地圖位置」：從播放頁跳回地圖並定位該機位 */
  .box .hd .goto{
    border:0;background:rgba(37,99,235,.10);color:#1d4ed8;border-radius:9px;
    padding:0 12px;height:32px;flex:0 0 auto;cursor:pointer;font-size:12px;
    font-weight:600;line-height:1;white-space:nowrap;display:inline-flex;
    align-items:center;gap:5px
  }
  .box .hd .goto:hover{background:rgba(37,99,235,.18)}
  .box .hd .goto[disabled]{background:rgba(15,30,50,.06);color:var(--muted);cursor:not-allowed}
  @media (max-width:520px){ .box .hd .goto .lbl{display:none} }
  .stage{position:relative;padding-top:56.25%;background:#0b0f16}
  .stage iframe,.stage .ph{position:absolute;inset:0;width:100%;height:100%;border:0}
  .stage .ph{display:flex;align-items:center;justify-content:center;color:#93a3b5;font-size:13px;text-align:center;padding:24px;line-height:1.8}
  .box .ft{padding:12px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.65;overflow:auto}
  .box .ft .note{color:#93370d;background:rgba(247,144,9,.12);border-radius:9px;padding:9px 11px;margin-bottom:10px}
  .box .ft .alt{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
  .box .ft .alt li{background:rgba(15,30,50,.04);border-radius:9px;padding:8px 10px}
  .box .ft .alt a{font-weight:600;text-decoration:none}
  .box .ft .alt a:hover{text-decoration:underline}
  .box .ft .alt .k{color:var(--muted);font-size:10.5px;margin-left:6px}
  .box .ft .src{margin-top:10px;color:var(--muted);font-size:10.5px}

  /* ── 響應式：手機版底部抽屜 ────────────────────────── */
  @media (max-width:820px){
    /* ET-EDIT ⚠️ iOS 會自動放大「font-size < 16px 的輸入框」所在的整個頁面 ——
       使用者回報「搜尋列會把畫面撐開」就是這個（按搜尋鈕時我們會自動 focus）。
       16px 是門檻，低於它 Safari 一定 zoom。
       ⚠️ 不要用 viewport 的 maximum-scale=1 來解：那會連使用者自己的縮放一起擋掉
          （無障礙問題），而且新版 iOS 不一定理它。 */
    .search input{font-size:16px}
    .psheetclose{display:grid}
    .panel{
      left:0;right:0;top:auto;width:auto;max-width:none;border-radius:18px 18px 0 0;
      /* ET-EDIT: 抬到瀏覽器底部工具列之上（--bh，由 JS 用視覺視窗 API 算出）
         + 讓開 iOS 首頁指示條（safe-area）。
         ⚠️ 為什麼要抬：iOS 的 Arc Search 等 App 有自己的底部工具列覆蓋在網頁上，
            貼底元素會被蓋住 → 看得到、點不到。 */
      bottom:calc(var(--bh, 0px) + env(safe-area-inset-bottom, 0px));
      /* ET-EDIT: 手機面板高度。
         本來 74vh「過大」→ 降到 58%，但實機回報「下方空間不夠，只能看到一項資料的 2/3」——
         因為抽屜的固定區塊（把手＋head＋controls＋foot）就吃掉 ~386px，
         58% 只剩 76px 給列表。
         解法是【兩邊下手】：①固定區塊瘦身（見下方 .head/.controls 規則）
         ②上限提到 86% —— 面板**開場完全隱藏**（見下方 .panel.collapsed），
         展開是使用者主動點搜尋鈕造成的，本來就是要看清單，所以放大是對的。 */
      max-height:calc(var(--vh, 100vh) * .86); transition:max-height .25s ease
    }
    /* ET-EDIT（2026-10-15）：收合 = **完全不佔位**（原本只縮成 56px 的把手條）。
       兩個理由，都是使用者實測回報：
         ① 「看不到地圖的宣告」—— 那條 56px 正好壓在右下角的授權標示上，
            而 **OSM 圖磚政策明文禁止把 attribution 藏在 UI 底下**（硬性要求，
            見 https://operations.osmfoundation.org/policies/tiles/ 第 2 節）。
            這不只是美觀問題，是合規問題。
         ② 「佔空間」。
       改成完全隱藏後，右下角歸地圖所有；要開面板就點左上的搜尋鈕（#searchFab）。 */
    .panel.collapsed{display:none}
    /* ⚠️ 面板「展開」時也不能蓋住授權標示（同一條政策）。
       把 Leaflet 右下角整組往上抬 --panelh（面板實測高度，由 setupFabs 維護）。
       縮放鈕不受影響：手機版它已經被改成 position:fixed 固定在左上。 */
    .leaflet-bottom.leaflet-right{bottom:var(--panelh, 0px)}
    .mobile-handle{display:block;padding:10px 0 6px;cursor:pointer;text-align:center}
    .mobile-handle i{display:inline-block;width:40px;height:4px;border-radius:3px;background:rgba(15,30,50,.22)}
    .head{padding:2px 14px 9px}
    /* ET-EDIT: 手機 head 瘦身 —— 固定區塊每省 1px，列表就多 1px。
       ① 隱藏 logo 與副標（手機上沒資訊價值，卻吃掉 ~44px）
       ② 統計 chips 改【單行橫向捲動】而不是換行（省 ~56px；換行會變兩列）
       ⚠️ 不要直接 display:none 掉 .stats —— 那排數字（共幾台／直播中／未播）
          是使用者判斷資料健康的方式，縮成一行仍要看得見。 */
    .brand .mark, .brand .sub{display:none}
    .stats{flex-wrap:nowrap;overflow-x:auto;margin-top:6px;scrollbar-width:none;
      -webkit-overflow-scrolling:touch}
    .stats::-webkit-scrollbar{display:none}
    .controls{padding:8px 14px;gap:7px}
    .listwrap{min-height:118px}
    .foot{padding-bottom:7px}
    .tools{top:14px;right:14px}
    /* ET-EDIT（2026-10-15）：「回到全日本」已併進 .tools（見 HTML 的註解），
       不再需要獨立的定位規則。舊版本放在 top:160 是浮在工具列下方約 100px 的
       空白處、跟任何東西都沒有視覺關聯 —— 使用者回報「在一個奇怪地方」。 */
    /* ET-EDIT: Leaflet 的縮放鈕在手機改到【左上、搜尋鈕下方】。
       為什麼不用「量面板高度再把縮放鈕推上去」：那要 ResizeObserver + 過渡動畫同步，
       實測難驗、容易在別的瀏覽器壞掉。移到左上則完全不需要量任何東西，
       永遠不會被底部面板蓋住。
       ⚠️ 用 position:fixed 而不是移動整個 .leaflet-bottom 容器 ——
          容器裡還有 attribution，搬容器會把版權標示也搬走。
       ⚠️ 62px = 搜尋鈕上緣 14px + 高度 38px + 10px 留白。 */
    .leaflet-bottom.leaflet-right .leaflet-control-zoom{
      position:fixed;left:14px;top:62px;right:auto;bottom:auto;margin:0
    }
    .box{width:100%;max-height:92vh;max-height:92dvh}
  }
  /* // ET-EDIT: 啟動錯誤位於面板外，手機收合清單時仍能看見並重試。 */
  #bootError{position:fixed;z-index:3300;top:14px;left:14px;right:14px;margin:0 auto;
    max-width:600px;max-height:calc(100dvh - 28px);overflow:auto;padding:16px;
    border:1px solid var(--offline);border-radius:12px;background:var(--bg);box-shadow:var(--shadow)}
  #bootError[hidden]{display:none}
  #bootError p{margin:0 0 12px;overflow-wrap:anywhere}
  #bootRetry{padding:9px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="map" role="application" aria-label="日本即時影像地圖"></div>

<!-- ET-EDIT（2026-10-15）：Toast 容器放在 body 最上層（詳見下方 .panel 內的註解：
     它原本在 .panel 裡，被面板的 overflow:hidden ＋ backdrop-filter 裁掉又跟著隱藏）。 -->
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
<!-- // ET-EDIT: 不依賴地圖初始化的錯誤與重試入口。 -->
<div id="bootError" role="alert" hidden>
  <p id="bootErrorText"></p>
  <button id="bootRetry" type="button">重新載入並重試</button>
</div>

<!-- ET-EDIT: 手機版搜尋鈕（只在抽屜收合時出現，桌面版隱藏） -->
<button class="searchfab" id="searchFab" type="button" aria-label="開啟搜尋" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
       stroke-linecap="round" aria-hidden="true">
    <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
  </svg><span>搜尋</span>
</button>


<aside class="panel" id="panel">
  <div class="mobile-handle" id="handle" title="收合清單（隱藏面板）"><i></i></div>
  <!-- ET-EDIT: 手機版收合鈕（桌機隱藏）。使用者回報「找不到關閉的方式」。 -->
  <button class="psheetclose" id="panelClose" type="button" title="收合清單" aria-label="收合清單">✕</button>
  <div class="head">
    <div class="brand">
      <div class="mark" aria-hidden="true">◉</div>
      <div>
        <h1>日本即時影像地圖</h1>
        <div class="sub">Japan Live Cams · 聚合公開直播（YouTube Live）</div>
        <!-- ET-EDIT: 資料新鮮度（由 buildFreshness() 填入；管線停擺時才看得出來） -->
        <div class="fresh" id="fresh"></div>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    </div>

    <!-- ET-EDIT: 管線健康示警橫幅（讀 data/pipeline_health.json；無檔案或正常時隱藏） -->
    <div class="warnbar" id="warnbar" role="status" hidden></div>

    <!-- ⚠️ ET-EDIT（2026-10-15）：Toast 容器**一定要放在面板外面**。
       它原本在 .panel 內，而 .panel 有 overflow:hidden ＋ backdrop-filter ——
       backdrop-filter 會讓 position:fixed 的子元素改以「面板」為基準並被裁切，
       不是以視窗為基準。結果：面板一隱藏 toast 就跟著不見、面板開著則被裁掉
       （使用者實測回報「toast 被蓋住，只露出一小角」）。
       移到 body 層後，fixed 定位與 3200 的 z-index 才真的對整個視窗生效。 -->

  <div class="controls">
    <div class="search" id="searchWrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" type="search" placeholder="搜尋景點 / 都道府縣 / 提供者…" autocomplete="off" aria-label="搜尋機位">
      <button class="clear" id="qClear" title="清除" aria-label="清除搜尋">✕</button>
    </div>

    <div class="seg" id="scope" role="group" aria-label="顯示範圍">
      <button data-scope="tourism" class="on">觀光優先 <span class="n" id="nTourism"></span></button>
      <button data-scope="all">顯示全部 <span class="n" id="nAll"></span></button>
    </div>

    <div class="seg" id="liveonly" role="group" aria-label="直播狀態" style="margin-top:6px">
      <button data-liveonly="1" class="on">只看直播中 <span class="n" id="nLive"></span></button>
      <button data-liveonly="0">含未播</button>
    </div>

    <!-- ET-EDIT（2026-10-28）：使用者指示「聚合型給一個新的頁籤列表」。
         聚合型直播（多鏡頭輪播、跨區彙整）沒有單一正確座標，畫在地圖上就是假點，

    <div class="seg" id="viewtab" role="group" aria-label="資料類型" style="margin-top:6px">

<!-- 系統通知彈窗：與機位 modal 分開，避免互相干擾
